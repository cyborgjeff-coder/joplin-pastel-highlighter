name: Compiler le plugin Joplin
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4
        with:
          path: personnalisation
      - name: Recuperer le modele Joplin
        uses: actions/checkout@v4
        with:
          repository: laurent22/joplin-plugin
          path: joplin-plugin
      - name: Preparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Copier et adapter le code
        shell: bash
        run: |
          cp personnalisation/src/index.ts joplin-plugin/src/index.ts
          cp personnalisation/src/manifest.json joplin-plugin/src/manifest.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path('joplin-plugin/src/index.ts')
          code = p.read_text()
          old = "import joplin from 'api';\nimport { ToolbarButtonLocation, MenuItemLocation } from 'api/types';"
          assert old in code, 'Imports inattendus : ne pas compiler un code non verifie'
          code = code.replace(old, "const ToolbarButtonLocation = { EditorToolbar: 'editorToolbar' };\nconst MenuItemLocation = { Tools: 'tools' };")
          p.write_text(code)
          print('Imports supprimes ; declaration joplin fournie par le modele ; emplacements definis')
          PY
      - name: Installer et compiler
        working-directory: joplin-plugin
        run: |
          npm install
          npm run dist
      - name: Verifier la compilation et fabriquer le JPL
        shell: bash
        run: |
          set -euo pipefail
          test -s joplin-plugin/dist/index.js
          test -s joplin-plugin/dist/manifest.json || cp joplin-plugin/src/manifest.json joplin-plugin/dist/manifest.json
          python3 - <<'PYVERIFY'
          import json, pathlib
          d = pathlib.Path('joplin-plugin/dist')
          m = json.loads((d/'manifest.json').read_text())
          assert m['id'] == 'fr.quena.pastel-highlighter-test03', m['id']
          js = (d/'index.js').read_text()
          assert 'require("api")' not in js and "require('api')" not in js, 'Import api encore present'
          print('Fichiers compiles verifies, identifiant:', m['id'])
          PYVERIFY
          tar -cf pastel-highlighter-test05.jpl -C joplin-plugin/dist index.js manifest.json
          tar -tf pastel-highlighter-test05.jpl
          test -s pastel-highlighter-test05.jpl
      - name: Mettre le JPL a disposition
        uses: actions/upload-artifact@v4
        with:
          name: pastel-highlighter-jpl
          path: pastel-highlighter-test05.jpl
          if-no-files-found: error
