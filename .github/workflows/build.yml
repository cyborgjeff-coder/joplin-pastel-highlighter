name: Compiler le plugin Joplin
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Preparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compiler le plugin avec esbuild
        run: |
          mkdir -p dist
          npx --yes --package=esbuild@0.25.12 esbuild src/index.ts --bundle --platform=node --format=cjs --target=node18 --external:api --external:api/types --outfile=dist/index.js
          cp src/manifest.json dist/manifest.json
      - name: Construire le fichier JPL
        run: |
          cd dist
          zip -q ../pastel-highlighter-test03.jpl index.js manifest.json
          cd ..
          unzip -t pastel-highlighter-test03.jpl
      - name: Telecharger le JPL
        uses: actions/upload-artifact@v4
        with:
          name: pastel-highlighter-jpl
          path: pastel-highlighter-test03.jpl
          if-no-files-found: error
