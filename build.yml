name: Compiler le plugin Joplin
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer ce projet
        uses: actions/checkout@v4
        with:
          path: personnalisation
      - name: Récupérer le modèle de plugin Joplin
        uses: actions/checkout@v4
        with:
          repository: laurent22/joplin-plugin
          path: joplin-plugin
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Copier le code et le manifeste
        run: |
          cp personnalisation/src/index.ts joplin-plugin/src/index.ts
          cp personnalisation/src/manifest.json joplin-plugin/src/manifest.json
      - name: Installer et compiler
        working-directory: joplin-plugin
        run: |
          npm install
          npm run dist
      - name: Vérifier la présence du JPL
        run: |
          find joplin-plugin -name '*.jpl' -type f -print
          test -n "$(find joplin-plugin -name '*.jpl' -type f -print -quit)"
      - name: Mettre le plugin à disposition
        uses: actions/upload-artifact@v4
        with:
          name: pastel-highlighter-jpl
          path: joplin-plugin/**/*.jpl
          if-no-files-found: error
